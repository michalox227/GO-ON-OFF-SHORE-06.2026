<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktywna Mapa 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #0a1428; }
    canvas { display: block; }

    #ui-panel {
      position: absolute; top: 15px; left: 15px;
      background: rgba(8, 18, 38, 0.88);
      color: white; padding: 16px 20px; border-radius: 14px;
      border: 1px solid rgba(80, 140, 255, 0.35);
      backdrop-filter: blur(12px);
      min-width: 195px; user-select: none;
      box-shadow: 0 4px 30px rgba(0,0,0,0.4);
    }
    #ui-panel h1 { font-size: 15px; font-weight: 700; color: #88ccff; margin-bottom: 12px; letter-spacing: 0.5px; }
    .legend-item {
      display: flex; align-items: center; gap: 9px;
      margin: 5px 0; font-size: 12px; cursor: pointer;
      padding: 4px 6px; border-radius: 6px;
      transition: background 0.2s; color: #ddeeff;
    }
    .legend-item:hover { background: rgba(100,160,255,0.12); }
    .legend-dot { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }

    #tooltip {
      position: absolute; display: none;
      background: rgba(8, 18, 38, 0.92);
      color: white; padding: 12px 16px; border-radius: 10px;
      border: 1px solid rgba(80, 140, 255, 0.45);
      pointer-events: none; font-size: 13px;
      max-width: 240px; backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: opacity 0.15s;
    }
    #tooltip h3 { color: #88ccff; margin-bottom: 5px; font-size: 14px; }
    #tooltip p { color: #b0ccee; line-height: 1.45; }

    #controls-hint {
      position: absolute; bottom: 15px; right: 15px;
      background: rgba(8, 18, 38, 0.78);
      color: rgba(180, 210, 255, 0.85);
      padding: 10px 15px; border-radius: 10px;
      font-size: 11px; line-height: 1.8;
      border: 1px solid rgba(80,140,255,0.2);
      backdrop-filter: blur(8px);
    }

    #loading {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #040d20 0%, #0a1e40 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: white; font-size: 18px; z-index: 100;
      gap: 20px;
      text-align: center; padding: 24px;
    }
    #loading.error { background: linear-gradient(135deg, #1d1020 0%, #311b2a 100%); }
    #loading.error .loader { display: none; }
    #loading.error span { max-width: 520px; line-height: 1.5; }
    .loader {
      width: 50px; height: 50px;
      border: 3px solid rgba(80,140,255,0.2);
      border-top-color: #5588ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader"></div>
    <span>Ładowanie mapy 3D…</span>
  </div>

  <script>
    function showMapLoadError(reason) {
      const loading = document.getElementById('loading');
      if (!loading || loading.style.display === 'none') return;
      loading.classList.add('error');
      loading.querySelector('span').textContent = 'Nie udało się załadować mapy 3D. Sprawdź połączenie z internetem i odśwież stronę.';
      console.error('Map loading failed:', reason);
    }
    window.addEventListener('error', event => showMapLoadError(event.message || event.error));
    window.addEventListener('unhandledrejection', event => showMapLoadError(event.reason));
  </script>

  <div id="ui-panel">
    <h1>🗺️ Mapa 3D</h1>
    <div class="legend-item"><div class="legend-dot" style="background:#1a7fff"></div>Morze</div>
    <div class="legend-item"><div class="legend-dot" style="background:#7a8898"></div>Miasto</div>
    <div class="legend-item"><div class="legend-dot" style="background:#aaaaaa"></div>Lotnisko</div>
    <div class="legend-item"><div class="legend-dot" style="background:#2a2a2a"></div>Autostrada</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1a6020"></div>Las</div>
    <div class="legend-item"><div class="legend-dot" style="background:#6ec840"></div>Łąki</div>
  </div>

  <div id="tooltip">
    <h3 id="tt-title"></h3>
    <p id="tt-desc"></p>
  </div>

  <div id="controls-hint">
    🖱 LPM + przeciągnij &nbsp;→ obracaj<br>
    🖱 PPM + przeciągnij &nbsp;→ przesuwaj<br>
    🖱 Scroll &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ przybliżaj<br>
    👆 Klik &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ informacje
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let seed = 42;
    function rand() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }

    // ─── RENDERER ────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    // ─── SCENE & CAMERA ──────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0xaad8f0, 0.0025);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 2000);
    camera.position.set(0, 260, 340);
    camera.lookAt(0, 0, 0);

    // ─── CONTROLS ────────────────────────────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 60;
    controls.maxDistance = 700;
    controls.maxPolarAngle = Math.PI / 2.15;

    // ─── LIGHTING ────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xd0e8ff, 0.55));

    const sun = new THREE.DirectionalLight(0xfff4d0, 1.6);
    sun.position.set(180, 320, 120);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { near: 1, far: 1000, left: -420, right: 420, top: 420, bottom: -420 });
    sun.shadow.bias = -0.001;
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0x87ceeb, 0x3d7a18, 0.45));

    // Sun sphere
    const sunSphere = new THREE.Mesh(
      new THREE.SphereGeometry(22, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xffee88 })
    );
    sunSphere.position.set(220, 420, -280);
    scene.add(sunSphere);
    const glowMesh = new THREE.Mesh(
      new THREE.SphereGeometry(34, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 0.28 })
    );
    glowMesh.position.copy(sunSphere.position);
    scene.add(glowMesh);

    // ─── CLICKABLE REGISTRY ──────────────────────────────────────────────────
    const clickable = [];

    function tag(mesh, name, desc) {
      mesh.userData = { name, desc };
      clickable.push(mesh);
      return mesh;
    }

    function tagGroup(group, name, desc) {
      group.traverse(m => { if (m.isMesh) { m.userData = { name, desc }; clickable.push(m); } });
    }

    // ─── ŁĄKI / TEREN ────────────────────────────────────────────────────────
    const terrainGeo = new THREE.PlaneGeometry(740, 740, 60, 60);
    const tPos = terrainGeo.attributes.position;
    for (let i = 0; i < tPos.count; i++) {
      const x = tPos.getX(i), y = tPos.getY(i);
      if (x < -125) continue; // sea zone stays flat
      tPos.setZ(i, Math.sin(x * 0.022) * Math.cos(y * 0.028) * 2.8 + Math.sin(x * 0.05 + y * 0.04) * 1.2);
    }
    terrainGeo.computeVertexNormals();

    const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshLambertMaterial({ color: 0x78c848 }));
    terrain.rotation.x = -Math.PI / 2;
    terrain.receiveShadow = true;
    tag(terrain, 'Łąki', 'Rozległe zielone łąki z trawą i kwiatami polnymi. Idealne miejsce na spacery i odpoczynek.');
    scene.add(terrain);

    // Kwiaty
    const flowerColors = [0xff3355, 0xffdd00, 0xff77aa, 0xaa33ff, 0xff6600, 0xffffff];
    for (let i = 0; i < 250; i++) {
      const x = -120 + rand() * 340, z = -100 + rand() * 420;
      if (x > 105 && z > -180 && z < 130) continue; // pomijaj miasto
      if (z < -105 && x > -95 && x < 145) continue; // pomijaj lotnisko
      if (Math.abs(z - 30) < 9 || (Math.abs(x - 110) < 9 && z < 30)) continue; // pomijaj autostrady
      const flower = new THREE.Mesh(
        new THREE.SphereGeometry(0.7, 4, 3),
        new THREE.MeshLambertMaterial({ color: flowerColors[Math.floor(rand() * flowerColors.length)] })
      );
      flower.position.set(x, 2.2, z);
      scene.add(flower);
    }

    // Stawy
    for (let i = 0; i < 3; i++) {
      const r = 7 + rand() * 7;
      const pond = new THREE.Mesh(
        new THREE.CircleGeometry(r, 14),
        new THREE.MeshPhongMaterial({ color: 0x3388cc, shininess: 120, transparent: true, opacity: 0.82 })
      );
      pond.rotation.x = -Math.PI / 2;
      pond.position.set(-60 + rand() * 60, 0.7, 50 + i * 90 + rand() * 30);
      tag(pond, 'Staw', 'Naturalny staw na łące z roślinnością wodną i ptakami.');
      scene.add(pond);
    }

    // ─── MORZE ───────────────────────────────────────────────────────────────
    // Głębina
    const deepSea = new THREE.Mesh(
      new THREE.PlaneGeometry(230, 740),
      new THREE.MeshLambertMaterial({ color: 0x003366 })
    );
    deepSea.rotation.x = -Math.PI / 2;
    deepSea.position.set(-275, 0, 0);
    scene.add(deepSea);

    // Fale (animowane) — niska liczba segmentów dla płynności
    const seaGeo = new THREE.PlaneGeometry(210, 740, 40, 120);
    const seaMat = new THREE.MeshPhongMaterial({
      color: 0x0066cc, shininess: 160, specular: 0x5599ff,
      transparent: true, opacity: 0.9
    });
    const sea = new THREE.Mesh(seaGeo, seaMat);
    sea.rotation.x = -Math.PI / 2;
    sea.position.set(-265, 2, 0);
    tag(sea, 'Morze Bałtyckie', 'Piękne błękitne morze z żywymi falami i bogatym życiem morskim. Idealne do żeglugi i kąpieli.');
    scene.add(sea);

    // Plaża
    const beach = new THREE.Mesh(
      new THREE.PlaneGeometry(32, 740),
      new THREE.MeshLambertMaterial({ color: 0xe8d5a0 })
    );
    beach.rotation.x = -Math.PI / 2;
    beach.position.set(-148, 0.35, 0);
    tag(beach, 'Plaża', 'Piaszczysta plaża nad brzegiem morza — idealna do wypoczynku latem.');
    scene.add(beach);

    // Kamienie przy brzegu
    for (let i = 0; i < 18; i++) {
      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1.5 + rand() * 4, 0),
        new THREE.MeshLambertMaterial({ color: 0x8a8a7a })
      );
      rock.position.set(-140 + rand() * 20 - 10, 0.6 + rand() * 1.5, -340 + rand() * 680);
      rock.rotation.set(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI);
      rock.castShadow = true;
      scene.add(rock);
    }

    // Latarnia morska
    const lighthouse = new THREE.Group();
    const lhBase = new THREE.Mesh(
      new THREE.CylinderGeometry(5, 7, 8, 10),
      new THREE.MeshLambertMaterial({ color: 0xe0e0d0 })
    );
    lhBase.position.y = 4;
    const lhTower = new THREE.Mesh(
      new THREE.CylinderGeometry(3, 5, 30, 10),
      new THREE.MeshLambertMaterial({ color: 0xffffff })
    );
    lhTower.position.y = 19;
    // Czerwone paski
    for (let i = 0; i < 4; i++) {
      const stripe = new THREE.Mesh(
        new THREE.CylinderGeometry(3.05, 3.05, 3, 10, 1, true),
        new THREE.MeshLambertMaterial({ color: 0xcc2211, side: THREE.DoubleSide })
      );
      stripe.position.y = 5 + i * 7;
      lhTower.add(stripe);
    }
    const lhTop = new THREE.Mesh(
      new THREE.CylinderGeometry(4, 3, 5, 10),
      new THREE.MeshPhongMaterial({ color: 0xffee88, emissive: 0xffcc00, emissiveIntensity: 0.6, shininess: 200 })
    );
    lhTop.position.y = 37;
    const lhHat = new THREE.Mesh(
      new THREE.ConeGeometry(4.5, 5, 10),
      new THREE.MeshLambertMaterial({ color: 0x333333 })
    );
    lhHat.position.y = 42;
    lighthouse.add(lhBase, lhTower, lhTop, lhHat);
    lighthouse.position.set(-130, 0, -300);
    tagGroup(lighthouse, 'Latarnia Morska', 'Historyczna latarnia morska z 1894 roku. Prowadzi statki bezpiecznie przez morze nocą.');
    scene.add(lighthouse);

    // Łódź na morzu
    function createBoat(x, z) {
      const g = new THREE.Group();
      const hull = new THREE.Mesh(
        new THREE.BoxGeometry(8, 3, 20),
        new THREE.MeshLambertMaterial({ color: 0x8b4513 })
      );
      hull.position.y = 1.5;
      const deck = new THREE.Mesh(
        new THREE.BoxGeometry(8, 1, 20),
        new THREE.MeshLambertMaterial({ color: 0xd2b48c })
      );
      deck.position.y = 3.5;
      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(5, 4, 8),
        new THREE.MeshLambertMaterial({ color: 0xf0f0e8 })
      );
      cabin.position.set(0, 7, -2);
      const mast = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.3, 18, 6),
        new THREE.MeshLambertMaterial({ color: 0x8b6914 })
      );
      mast.position.set(0, 13, 4);
      g.add(hull, deck, cabin, mast);
      g.position.set(x, 0, z);
      tagGroup(g, 'Łódź Rybacka', 'Tradycyjna łódź rybacka pływająca po morzu. Rybacy wypływają o świcie na połów.');
      return g;
    }
    scene.add(createBoat(-230, -180));
    scene.add(createBoat(-250, 80));
    scene.add(createBoat(-200, 220));

    // ─── LAS ─────────────────────────────────────────────────────────────────
    const forestFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(245, 260),
      new THREE.MeshLambertMaterial({ color: 0x2a5518 })
    );
    forestFloor.rotation.x = -Math.PI / 2;
    forestFloor.position.set(-190, 0.25, 195);
    forestFloor.receiveShadow = true;
    tag(forestFloor, 'Las Mieszany', 'Gęsty las mieszany z sosnami, świerkami i dębami. Schronienie dla dzikiej zwierzyny.');
    scene.add(forestFloor);

    // Paprocie / krzewy
    for (let i = 0; i < 50; i++) {
      const bush = new THREE.Mesh(
        new THREE.SphereGeometry(2 + rand() * 2.5, 6, 4),
        new THREE.MeshLambertMaterial({ color: 0x1a4a10 })
      );
      bush.position.set(-310 + rand() * 240, 1.8, 70 + rand() * 250);
      bush.scale.y = 0.6;
      bush.castShadow = true;
      scene.add(bush);
    }

    function createTree(x, z, scale = 1) {
      const g = new THREE.Group();
      const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b3a2a });
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8 * scale, 1.3 * scale, 10 * scale, 7), trunkMat);
      trunk.position.y = 5 * scale;
      trunk.castShadow = true;
      g.add(trunk);

      const shades = [0x2a7a1c, 0x228b22, 0x1c6b18, 0x3a8b28];
      for (let i = 0; i < 3; i++) {
        const cone = new THREE.Mesh(
          new THREE.ConeGeometry((5 - i) * scale, (9 - i * 1.5) * scale, 8),
          new THREE.MeshLambertMaterial({ color: shades[i % shades.length] })
        );
        cone.position.y = (10 + i * 6) * scale;
        cone.castShadow = true;
        g.add(cone);
      }
      g.position.set(x, 0, z);
      tagGroup(g, 'Las Mieszany', 'Gęsty las mieszany z sosnami, świerkami i dębami. Schronienie dla dzikiej zwierzyny.');
      return g;
    }

    for (let i = 0; i < 110; i++) {
      const x = -315 + rand() * 230, z = 68 + rand() * 255;
      if (x < -132) continue;
      scene.add(createTree(x, z, 0.6 + rand() * 0.9));
    }

    // ─── MIASTO ──────────────────────────────────────────────────────────────
    const cityFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(260, 300),
      new THREE.MeshLambertMaterial({ color: 0x6a6a6a })
    );
    cityFloor.rotation.x = -Math.PI / 2;
    cityFloor.position.set(190, 0.25, -15);
    cityFloor.receiveShadow = true;
    tag(cityFloor, 'Centrum Miasta', 'Nowoczesne centrum miejskie z wieżowcami, parkami i gęstą siecią ulic.');
    scene.add(cityFloor);

    // Parki miejskie
    for (let i = 0; i < 6; i++) {
      const park = new THREE.Mesh(
        new THREE.PlaneGeometry(18 + rand() * 14, 18 + rand() * 14),
        new THREE.MeshLambertMaterial({ color: 0x50a028 })
      );
      park.rotation.x = -Math.PI / 2;
      park.position.set(110 + rand() * 170, 0.3, -145 + rand() * 280);
      scene.add(park);
    }

    // Tekstura okien
    function windowTex(hexStr) {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = hexStr;
      ctx.fillRect(0, 0, 64, 128);
      ctx.fillStyle = 'rgba(200,225,255,0.72)';
      for (let row = 1; row <= 9; row++)
        for (let col = 0; col < 4; col++)
          ctx.fillRect(col * 16 + 3, row * 13 + 1, 10, 9);
      return new THREE.CanvasTexture(c);
    }

    function createBuilding(x, z, w, h, d, color) {
      const col = '#' + color.toString(16).padStart(6, '0');
      const tex = windowTex(col);
      const mats = [
        new THREE.MeshLambertMaterial({ map: tex }),
        new THREE.MeshLambertMaterial({ map: tex }),
        new THREE.MeshLambertMaterial({ color }),
        new THREE.MeshLambertMaterial({ color: 0x444455 }),
        new THREE.MeshLambertMaterial({ map: tex }),
        new THREE.MeshLambertMaterial({ map: tex }),
      ];
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats);
      b.position.set(x, h / 2, z);
      b.castShadow = true; b.receiveShadow = true;
      tag(b, 'Centrum Miasta', 'Nowoczesne centrum miejskie z wieżowcami, parkami i gęstą siecią ulic.');
      return b;
    }

    const buildingList = [
      // Wieżowce
      { x: 158, z: -75, w: 17, h: 95, d: 17, c: 0x8898b8 },
      { x: 180, z: -58, w: 15, h: 115, d: 15, c: 0x7080a0 },
      { x: 202, z: -78, w: 19, h: 80, d: 19, c: 0x909ab0 },
      { x: 178, z: -30, w: 16, h: 85, d: 16, c: 0x8090a8 },
      { x: 225, z: -62, w: 20, h: 60, d: 18, c: 0x788898 },
      { x: 248, z: -48, w: 17, h: 70, d: 17, c: 0x6878a0 },
      { x: 268, z: -72, w: 14, h: 55, d: 14, c: 0x7888a8 },
      // Średnie budynki
      { x: 142, z: -22, w: 20, h: 42, d: 16, c: 0xc8c0a8 },
      { x: 165, z: 14, w: 22, h: 32, d: 20, c: 0xd0c8b0 },
      { x: 198, z: 8, w: 24, h: 38, d: 22, c: 0xb8b0a0 },
      { x: 228, z: -22, w: 20, h: 45, d: 18, c: 0xa0a898 },
      { x: 258, z: -28, w: 18, h: 50, d: 18, c: 0x788890 },
      { x: 278, z: -10, w: 20, h: 28, d: 16, c: 0xa8a898 },
      { x: 290, z: -55, w: 16, h: 35, d: 20, c: 0x909898 },
      // Niskie budynki / sklepy
      { x: 140, z: 44, w: 28, h: 16, d: 22, c: 0xe8d8b8 },
      { x: 174, z: 48, w: 22, h: 14, d: 20, c: 0xd8c8a8 },
      { x: 212, z: 44, w: 24, h: 20, d: 22, c: 0xc8b898 },
      { x: 248, z: 24, w: 20, h: 26, d: 18, c: 0xb8a888 },
      { x: 142, z: -95, w: 22, h: 30, d: 20, c: 0xb0b8c0 },
      { x: 176, z: -104, w: 18, h: 38, d: 16, c: 0xa0a8b0 },
      { x: 208, z: -98, w: 16, h: 48, d: 16, c: 0x8898a8 },
      { x: 238, z: -94, w: 20, h: 34, d: 18, c: 0x9090a0 },
      { x: 272, z: -92, w: 14, h: 42, d: 14, c: 0x8080a0 },
    ];
    buildingList.forEach(b => scene.add(createBuilding(b.x, b.z, b.w, b.h, b.d, b.c)));

    // Drogi miejskie
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x484848 });
    [-95, -48, 0, 48, 95].forEach(z => {
      const r = new THREE.Mesh(new THREE.PlaneGeometry(260, 7), roadMat);
      r.rotation.x = -Math.PI / 2; r.position.set(190, 0.35, z); scene.add(r);
    });
    [125, 160, 200, 240, 278, 310].forEach(x => {
      const r = new THREE.Mesh(new THREE.PlaneGeometry(7, 300), roadMat);
      r.rotation.x = -Math.PI / 2; r.position.set(x, 0.35, -15); scene.add(r);
    });

    // ─── LOTNISKO ────────────────────────────────────────────────────────────
    // Murawa lotniskowa
    const airGrass = new THREE.Mesh(
      new THREE.PlaneGeometry(260, 240),
      new THREE.MeshLambertMaterial({ color: 0x56a030 })
    );
    airGrass.rotation.x = -Math.PI / 2;
    airGrass.position.set(15, 0.18, -220);
    scene.add(airGrass);

    // Tarmac
    const tarmac = new THREE.Mesh(
      new THREE.PlaneGeometry(260, 240),
      new THREE.MeshLambertMaterial({ color: 0x888888 })
    );
    tarmac.rotation.x = -Math.PI / 2;
    tarmac.position.set(15, 0.22, -220);
    tag(tarmac, 'Lotnisko Międzynarodowe', 'Nowoczesne lotnisko obsługujące 5 milionów pasażerów rocznie. Połączenia do 80 miast w Europie.');
    scene.add(tarmac);

    // Pas startowy
    const runway = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 200),
      new THREE.MeshLambertMaterial({ color: 0x1a1a1a })
    );
    runway.rotation.x = -Math.PI / 2;
    runway.position.set(15, 0.35, -220);
    tag(runway, 'Pas Startowy', 'Główny pas startowy długości 3,2 km. Obsługuje samoloty do Boeing 747 i Airbus A380.');
    scene.add(runway);

    // Pobocza pasa
    [-15, 15].forEach(off => {
      const shoulder = new THREE.Mesh(
        new THREE.PlaneGeometry(6, 200),
        new THREE.MeshLambertMaterial({ color: 0x5a5a5a })
      );
      shoulder.rotation.x = -Math.PI / 2;
      shoulder.position.set(15 + off, 0.32, -220);
      scene.add(shoulder);
    });

    // Oznaczenia pasa - linia środkowa
    const whiteMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    for (let i = -9; i <= 9; i++) {
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 10), whiteMat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(15, 0.42, -220 + i * 21);
      scene.add(dash);
    }
    // Progi pasa
    [-8, -4, 0, 4, 8].forEach(off => {
      [-315, -125].forEach(end => {
        const thresh = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 16), whiteMat);
        thresh.rotation.x = -Math.PI / 2;
        thresh.position.set(15 + off, 0.42, end);
        scene.add(thresh);
      });
    });

    // Droga kołowania
    const taxiMat = new THREE.MeshLambertMaterial({ color: 0x383838 });
    const taxi1 = new THREE.Mesh(new THREE.PlaneGeometry(10, 120), taxiMat);
    taxi1.rotation.x = -Math.PI / 2; taxi1.position.set(-38, 0.3, -240);
    scene.add(taxi1);
    const taxi2 = new THREE.Mesh(new THREE.PlaneGeometry(80, 10), taxiMat);
    taxi2.rotation.x = -Math.PI / 2; taxi2.position.set(-18, 0.3, -295);
    scene.add(taxi2);
    // Linia środkowa kołowania (żółta)
    const yellowMat = new THREE.MeshLambertMaterial({ color: 0xffdd00 });
    for (let i = -5; i <= 5; i++) {
      const yd = new THREE.Mesh(new THREE.PlaneGeometry(1, 8), yellowMat);
      yd.rotation.x = -Math.PI / 2; yd.position.set(-38, 0.38, -240 + i * 11);
      scene.add(yd);
    }

    // Terminal
    const terminal = new THREE.Mesh(
      new THREE.BoxGeometry(95, 16, 32),
      new THREE.MeshLambertMaterial({ color: 0xe0eaf8 })
    );
    terminal.position.set(-28, 8, -308);
    terminal.castShadow = true;
    tag(terminal, 'Terminal Pasażerski', 'Nowoczesny terminal z 4 bramkami odlotów, sklepami duty-free i restauracjami.');
    scene.add(terminal);

    // Dach terminalu
    const termRoof = new THREE.Mesh(
      new THREE.BoxGeometry(97, 2.5, 34),
      new THREE.MeshLambertMaterial({ color: 0x8888a0 })
    );
    termRoof.position.set(-28, 17.25, -308);
    scene.add(termRoof);

    // Gate'y
    for (let i = 0; i < 4; i++) {
      const gate = new THREE.Mesh(
        new THREE.BoxGeometry(5, 4.5, 22),
        new THREE.MeshLambertMaterial({ color: 0xc8d8e8 })
      );
      gate.position.set(-56 + i * 26, 6, -291);
      scene.add(gate);
    }

    // Wieża kontroli
    const tower = new THREE.Mesh(
      new THREE.CylinderGeometry(3.8, 5.5, 38, 10),
      new THREE.MeshLambertMaterial({ color: 0xd0d8e8 })
    );
    tower.position.set(-82, 19, -278);
    tower.castShadow = true;
    tag(tower, 'Wieża Kontroli Lotów', 'Centrum zarządzania ruchem lotniczym w promieniu 80 km. Czynna 24h/dobę.');
    scene.add(tower);

    const towerCap = new THREE.Mesh(
      new THREE.CylinderGeometry(7.5, 5.5, 7.5, 10),
      new THREE.MeshPhongMaterial({ color: 0x88bbff, transparent: true, opacity: 0.78, shininess: 200 })
    );
    towerCap.position.set(-82, 42.75, -278);
    tag(towerCap, 'Wieża Kontroli Lotów', 'Centrum zarządzania ruchem lotniczym w promieniu 80 km. Czynna 24h/dobę.');
    scene.add(towerCap);

    // Antena na wieży
    const antenna = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.3, 12, 4),
      new THREE.MeshLambertMaterial({ color: 0xff2200 })
    );
    antenna.position.set(-82, 53, -278);
    scene.add(antenna);

    // Samoloty
    function createPlane(x, y, z, ry = 0) {
      const g = new THREE.Group();
      const white = new THREE.MeshLambertMaterial({ color: 0xf8f8ff });
      const blue = new THREE.MeshLambertMaterial({ color: 0x1144bb });
      const grey = new THREE.MeshLambertMaterial({ color: 0x888888 });

      const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.5, 32, 10), white);
      fuselage.rotation.z = Math.PI / 2; g.add(fuselage);

      const nose = new THREE.Mesh(new THREE.ConeGeometry(2.2, 7, 10), white);
      nose.rotation.z = -Math.PI / 2; nose.position.x = 19.5; g.add(nose);

      const wings = new THREE.Mesh(new THREE.BoxGeometry(5, 0.7, 46), white);
      wings.position.set(3, -0.6, 0); g.add(wings);

      [-22, 22].forEach(zw => {
        const wt = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 1), blue);
        wt.position.set(3, 0, zw); g.add(wt);
      });

      const vstab = new THREE.Mesh(new THREE.BoxGeometry(0.7, 9, 11), blue);
      vstab.position.set(-14, 4.5, 0); g.add(vstab);

      const hstab = new THREE.Mesh(new THREE.BoxGeometry(1, 0.6, 18), white);
      hstab.position.set(-14, 2, 0); g.add(hstab);

      [-15, 15].forEach(ze => {
        const eng = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 2.2, 7, 8), grey);
        eng.rotation.z = Math.PI / 2; eng.position.set(6, -2.8, ze * 0.65); g.add(eng);
      });

      g.position.set(x, y, z); g.rotation.y = ry;
      tagGroup(g, 'Samolot Pasażerski', 'Airbus A320 — 180 miejsc. Loty do Londynu, Berlina i Paryża.');
      return g;
    }

    scene.add(createPlane(-48, 5.5, -285, Math.PI * 0.35));
    scene.add(createPlane(38, 5.5, -195, 0));
    scene.add(createPlane(70, 5.5, -280, -Math.PI * 0.15));

    // ─── AUTOSTRADY ──────────────────────────────────────────────────────────
    const hwMat = new THREE.MeshLambertMaterial({ color: 0x2a2a2a });
    const hwYellow = new THREE.MeshLambertMaterial({ color: 0xffdd00 });
    const hwWhite = new THREE.MeshLambertMaterial({ color: 0xffffff });

    // A1 pozioma (Wschód-Zachód)
    const a1 = new THREE.Mesh(new THREE.PlaneGeometry(740, 15), hwMat);
    a1.rotation.x = -Math.PI / 2; a1.position.set(0, 0.6, 30);
    tag(a1, 'Autostrada A1 (Wschód-Zachód)', 'Główna autostrada łącząca miasto z portem morskim. Długość 320 km, 3 pasy w każdą stronę.');
    scene.add(a1);

    // A2 pionowa (Północ-Południe)
    const a2 = new THREE.Mesh(new THREE.PlaneGeometry(15, 740), hwMat);
    a2.rotation.x = -Math.PI / 2; a2.position.set(110, 0.6, 0);
    tag(a2, 'Autostrada A2 (Północ-Południe)', 'Autostrada łącząca lotnisko z centrum miasta i dalej na południe. Długość 210 km.');
    scene.add(a2);

    // Oznaczenia A1
    for (let i = -18; i <= 18; i++) {
      const yd = new THREE.Mesh(new THREE.PlaneGeometry(12, 1.6), hwYellow);
      yd.rotation.x = -Math.PI / 2; yd.position.set(i * 20, 0.65, 30); scene.add(yd);
      [-5, 5].forEach(off => {
        const wd = new THREE.Mesh(new THREE.PlaneGeometry(9, 0.7), hwWhite);
        wd.rotation.x = -Math.PI / 2; wd.position.set(i * 20, 0.65, 30 + off); scene.add(wd);
      });
    }
    // Oznaczenia A2
    for (let i = -18; i <= 18; i++) {
      const yd = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 12), hwYellow);
      yd.rotation.x = -Math.PI / 2; yd.position.set(110, 0.65, i * 20); scene.add(yd);
      [-5, 5].forEach(off => {
        const wd = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 9), hwWhite);
        wd.rotation.x = -Math.PI / 2; wd.position.set(110 + off, 0.65, i * 20); scene.add(wd);
      });
    }

    // Bariery betonowe
    const barrierMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
    [-9, 9].forEach(off => {
      const b1 = new THREE.Mesh(new THREE.BoxGeometry(740, 2.5, 1), barrierMat);
      b1.position.set(0, 1.25, 30 + off); scene.add(b1);
      const b2 = new THREE.Mesh(new THREE.BoxGeometry(1, 2.5, 740), barrierMat);
      b2.position.set(110 + off, 1.25, 0); scene.add(b2);
    });

    // Węzeł autostradowy
    const junction = new THREE.Mesh(
      new THREE.BoxGeometry(32, 4.5, 32),
      new THREE.MeshLambertMaterial({ color: 0x555555 })
    );
    junction.position.set(110, 2.25, 30);
    scene.add(junction);

    // Znaki drogowe
    function createSign(x, z, text) {
      const group = new THREE.Group();
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.3, 8, 6),
        new THREE.MeshLambertMaterial({ color: 0x888888 })
      );
      pole.position.set(0, 4, 0);
      pole.castShadow = true;
      const board = new THREE.Mesh(
        new THREE.BoxGeometry(10, 3.5, 0.4),
        new THREE.MeshLambertMaterial({ color: 0x006600 })
      );
      board.position.set(0, 9, 0);
      board.castShadow = true;

      const labelCanvas = document.createElement('canvas');
      labelCanvas.width = 256;
      labelCanvas.height = 96;
      const ctx = labelCanvas.getContext('2d');
      ctx.fillStyle = '#006600';
      ctx.fillRect(0, 0, labelCanvas.width, labelCanvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 28px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, labelCanvas.width / 2, labelCanvas.height / 2);

      const label = new THREE.Mesh(
        new THREE.PlaneGeometry(9.2, 2.8),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(labelCanvas), transparent: true })
      );
      label.position.set(0, 9, 0.23);

      group.add(pole, board, label);
      group.position.set(x, 0, z);
      if (Math.abs(x - 110) < 8) group.rotation.y = -Math.PI / 2;
      tagGroup(group, 'Znak Drogowy', `Drogowskaz: ${text}.`);
      scene.add(group);
    }
    createSign(-50, 32, 'MIASTO'); createSign(60, 32, 'LOTNISKO');
    createSign(112, -80, 'CENTRUM'); createSign(112, 80, 'POŁUDNIE');

    // ─── CHMURY ──────────────────────────────────────────────────────────────
    function createCloud(x, y, z, scale = 1) {
      const g = new THREE.Group();
      const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.88 });
      [
        [0, 0, 0, 16], [-16, -3, 0, 11], [16, -4, 0, 13],
        [-8, 5, 3, 10], [10, 4, -2, 12], [0, -1, 10, 9],
      ].forEach(([cx, cy, cz, r]) => {
        const s = new THREE.Mesh(new THREE.SphereGeometry(r * scale, 8, 6), mat);
        s.position.set(cx * scale, cy * scale, cz * scale); g.add(s);
      });
      g.position.set(x, y, z);
      return g;
    }

    const clouds = [];
    [
      [-220, 130, -180, 1.0], [80, 150, -220, 0.85], [60, 118, 110, 0.9],
      [-90, 138, 55, 1.1], [210, 132, -60, 0.8], [-140, 122, 210, 0.95],
      [260, 142, 140, 0.75], [10, 125, -310, 1.0], [-50, 148, -60, 0.88],
      [140, 135, 280, 0.7], [-180, 120, -80, 1.0],
    ].forEach(([x, y, z, s]) => {
      const c = createCloud(x, y, z, s);
      clouds.push(c); scene.add(c);
    });

    // ─── ANIMACJA FAL MORZA ───────────────────────────────────────────────────
    const seaPos = sea.geometry.attributes.position;
    const seaOrig = new Float32Array(seaPos.count * 3);
    for (let i = 0; i < seaPos.count; i++) {
      seaOrig[i * 3] = seaPos.getX(i);
      seaOrig[i * 3 + 1] = seaPos.getY(i);
      seaOrig[i * 3 + 2] = seaPos.getZ(i);
    }

    // ─── RAYCASTING ──────────────────────────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttDesc = document.getElementById('tt-desc');
    let tooltipVisible = false;

    window.addEventListener('mousemove', e => {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;
      if (tooltipVisible) {
        tooltip.style.left = (e.clientX + 16) + 'px';
        tooltip.style.top = Math.max(10, e.clientY - 60) + 'px';
      }
    });

    window.addEventListener('click', e => {
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(clickable, false);
      if (hits.length > 0 && hits[0].object.userData.name) {
        const d = hits[0].object.userData;
        ttTitle.textContent = d.name;
        ttDesc.textContent = d.desc;
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 16) + 'px';
        tooltip.style.top = Math.max(10, e.clientY - 60) + 'px';
        tooltipVisible = true;
      } else {
        tooltip.style.display = 'none';
        tooltipVisible = false;
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ─── PĘTLA ANIMACJI ───────────────────────────────────────────────────────
    let clock = 0;
    let frame = 0;

    function animate() {
      requestAnimationFrame(animate);
      clock += 0.016;
      frame++;

      // Fale morskie
      for (let i = 0; i < seaPos.count; i++) {
        const x = seaOrig[i * 3], y = seaOrig[i * 3 + 1];
        const wave = Math.sin(x * 0.07 + clock * 1.4) * 1.4 + Math.cos(y * 0.06 + clock * 0.9) * 0.9
                   + Math.sin((x + y) * 0.05 + clock * 1.1) * 0.5;
        seaPos.setZ(i, seaOrig[i * 3 + 2] + wave);
      }
      seaPos.needsUpdate = true;
      if (frame % 3 === 0) sea.geometry.computeVertexNormals();

      // Zmiana koloru morza
      seaMat.color.setHSL(0.585 + Math.sin(clock * 0.4) * 0.018, 0.88, 0.38 + Math.sin(clock * 0.6) * 0.04);

      // Chmury dryfują
      clouds.forEach((c, i) => {
        c.position.x += 0.025 + i * 0.003;
        if (c.position.x > 420) c.position.x = -420;
      });

      // Mruganie latarni
      lhTop.material.emissiveIntensity = 0.4 + Math.abs(Math.sin(clock * 2.5)) * 1.5;

      // Obrót anteny
      antenna.rotation.y += 0.02;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
    document.getElementById('loading').style.display = 'none';
  </script>
</body>
</html>
